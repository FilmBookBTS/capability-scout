<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170" role="img" aria-labelledby="t d">
<title id="t">How Capability Scout works</title>
<desc id="d">Five steps from left to right: you send a request; Claude Code's hook checks whether it is substantive work; the skill checks which capabilities work here; Claude shows a short capability plan; then Claude does the task, installing nothing without approval.</desc>
<rect width="900" height="170" fill="#ffffff"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect x="31" y="40" width="150" height="86" rx="8" fill="#eef2f8" stroke="#4a6fa5"/>
<text x="106" y="70" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#111">You send a request</text>
<line x1="181" y1="83.0" x2="201" y2="83.0" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
<rect x="203" y="40" width="150" height="86" rx="8" fill="#eef2f8" stroke="#4a6fa5"/>
<text x="278" y="70" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#111">Is it substantive</text>
<text x="278" y="88" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#111">work?</text>
<text x="278" y="144" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#444">(hook, Claude Code</text>
<text x="278" y="158" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#444">only)</text>
<line x1="353" y1="83.0" x2="373" y2="83.0" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
<rect x="375" y="40" width="150" height="86" rx="8" fill="#eef2f8" stroke="#4a6fa5"/>
<text x="450" y="70" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#111">Check what works</text>
<text x="450" y="88" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#111">here</text>
<text x="450" y="144" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#444">(the skill)</text>
<line x1="525" y1="83.0" x2="545" y2="83.0" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
<rect x="547" y="40" width="150" height="86" rx="8" fill="#eef2f8" stroke="#4a6fa5"/>
<text x="622" y="70" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#111">Show a short</text>
<text x="622" y="88" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#111">capability plan</text>
<text x="622" y="144" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#444">(5 lines or fewer)</text>
<line x1="697" y1="83.0" x2="717" y2="83.0" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
<rect x="719" y="40" width="150" height="86" rx="8" fill="#eef2f8" stroke="#4a6fa5"/>
<text x="794" y="70" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#111">Do the task</text>
<text x="794" y="144" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#444">(nothing installed</text>
<text x="794" y="158" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#444">without approval)</text>
</svg>

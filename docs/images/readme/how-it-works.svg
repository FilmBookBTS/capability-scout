<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 290" width="1280" height="290" role="img" aria-labelledby="t d">
<title id="t">How Capability Scout works</title>
<desc id="d">Five steps from left to right: you send a request; in Claude Code a hook checks whether it is substantive work; the skill checks which capabilities work here; Claude shows a short capability plan; Claude does the task and installs nothing without approval. In claude.ai chat there is no hook.</desc>
<style>.fl{animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-20}}.g0{opacity:0;animation:g0 8.0s linear infinite}@keyframes g0{0%,0.0%{opacity:0}2.0%,20.0%{opacity:1}24.0%,100%{opacity:0}}.g1{opacity:0;animation:g1 8.0s linear infinite}@keyframes g1{0%,20.0%{opacity:0}22.0%,40.0%{opacity:1}44.0%,100%{opacity:0}}.g2{opacity:0;animation:g2 8.0s linear infinite}@keyframes g2{0%,40.0%{opacity:0}42.0%,60.0%{opacity:1}64.0%,100%{opacity:0}}.g3{opacity:0;animation:g3 8.0s linear infinite}@keyframes g3{0%,60.0%{opacity:0}62.0%,80.0%{opacity:1}84.0%,100%{opacity:0}}.g4{opacity:0;animation:g4 8.0s linear infinite}@keyframes g4{0%,80.0%{opacity:0}82.0%,100.0%{opacity:1}100%,100%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>

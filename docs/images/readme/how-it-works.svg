<text x="315" y="173" font-family="ui-sans-serif,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="19" fill="#E9EEF7" font-weight="700">work?</text>
<text x="315" y="198" font-family="ui-sans-serif,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#F5B544">Claude Code only</text>

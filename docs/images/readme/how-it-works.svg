<text x="1078" y="102" font-family="ui-sans-serif,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#0B1220" font-weight="800" text-anchor="middle">5</text>
<text x="1244" y="101" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="14" fill="#93A3BF" text-anchor="end">Claude</text>
<text x="1068" y="148" font-family="ui-sans-serif,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="19" fill="#E9EEF7" font-weight="700">Do the task</text>
<text x="1068" y="180" font-family="ui-sans-serif,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#5EE6C8">installs nothing</text>
<text x="1068" y="198" font-family="ui-sans-serif,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#5EE6C8">without approval</text>
<text x="44" y="262" font-family="ui-sans-serif,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#93A3BF">In claude.ai chat there is no hook: Claude decides from the skill's description whether to run it.</text>

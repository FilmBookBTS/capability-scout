<circle cx="827" cy="96" r="15" fill="#F5B544"/>
<text x="827" y="102" font-family="ui-sans-serif,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#0B1220" font-weight="800" text-anchor="middle">4</text>
<text x="993" y="101" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="14" fill="#93A3BF" text-anchor="end">Claude</text>
<text x="817" y="148" font-family="ui-sans-serif,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="19" fill="#E9EEF7" font-weight="700">A short</text>
<text x="817" y="173" font-family="ui-sans-serif,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="19" fill="#E9EEF7" font-weight="700">capability plan</text>
<path class="fl" d="M1015 144.0H1044" stroke="#5EE6C8" stroke-width="2.5" stroke-dasharray="6 4"/>

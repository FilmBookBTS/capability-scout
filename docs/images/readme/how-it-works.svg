<text x="64" y="148" font-family="ui-sans-serif,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="19" fill="#E9EEF7" font-weight="700">You send</text>
<text x="64" y="173" font-family="ui-sans-serif,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="19" fill="#E9EEF7" font-weight="700">a request</text>

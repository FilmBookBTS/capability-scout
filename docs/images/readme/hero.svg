<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-labelledby="t d">
<title id="t">Capability Scout</title>
<desc id="d">Capability Scout. A radar sweeps over the capabilities in a session: a skill, a built-in tool and a plugin that work, a connector that needs sign-in, and one worth adding. Beside it, a request is typed and Claude answers with a short capability plan before doing the work.</desc>
<style>.sweep{transform-origin:1010px 240px;animation:spin 6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.caret{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.p0{transform-origin:1083.9px 145.4px;animation:ping 6s ease-out 0.63s infinite}.p1{transform-origin:1149.1px 296.2px;animation:ping 6s ease-out 1.87s infinite}.p2{transform-origin:975.8px 334.0px;animation:ping 6s ease-out 3.33s infinite}.p3{transform-origin:880.2px 187.6px;animation:ping 6s ease-out 4.87s infinite}.p4{transform-origin:913.8px 59.0px;animation:ping 6s ease-out 5.53s infinite}@keyframes ping{0%{transform:scale(.6);opacity:.9}18%{transform:scale(2.4);opacity:0}100%{transform:scale(2.4);opacity:0}}.ty{animation:ty 12s infinite}@keyframes ty{0%,2.5%{transform:translateX(-476px);animation-timing-function:steps(42,end)}20.83%,100%{transform:translateX(0)}}.h0{animation:h0 12s linear infinite}@keyframes h0{0%,23.33%{opacity:0;transform:translateY(6px)}27.5%,92%{opacity:1;transform:none}95%,100%{opacity:0;transform:none}}.l0{animation:l0 12s linear infinite}@keyframes l0{0%,27.5%{opacity:0;transform:translateY(6px)}31.67%,92%{opacity:1;transform:none}95%,100%{opacity:0;transform:none}}.l1{animation:l1 12s linear infinite}@keyframes l1{0%,32.08%{opacity:0;transform:translateY(6px)}36.25%,92%{opacity:1;transform:none}95%,100%{opacity:0;transform:none}}.l2{animation:l2 12s linear infinite}@keyframes l2{0%,36.67%{opacity:0;transform:translateY(6px)}40.84%,92%{opacity:1;transform:none}95%,100%{opacity:0;transform:none}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
